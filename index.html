
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KT 하이오더 소개</title>
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .swiper {
      width: 100%;
      height: 100vh;
    }
    .swiper-slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .slide1 {
      background-color: #005fcc;
      color: white;
      text-align: center;
    }
    .slide2 {
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }
    .slide2 img {
      max-width: 80%;
      border-radius: 10px;
      margin-top: 2rem;
    }
    .cta-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 2rem;
      background-color: #005fcc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="swiper">
    <div class="swiper-wrapper">
      <!-- Slide 1 -->
      <div class="swiper-slide slide1">
        <h1>KT 하이오더</h1>
        <p>스마트한 주문 솔루션, 하이오더</p>
        <a href="tel:01033957700" class="cta-btn">장지호 과장에게 전화하기</a>
      </div>
      <!-- Slide 2 -->
      <div class="swiper-slide slide2">
        <h2>키오스크 이미지</h2>
        <p>하이오더는 직관적인 인터페이스와 편리한 주문 시스템을 제공합니다.</p>
        <img src="kiosk-image.jpg" alt="하이오더 키오스크 이미지" />
      </div>
    
      <!-- Slide 3 -->
      <div class="swiper-slide slide1">
        <h2>소상공인 프랜차이즈 패키지</h2>
        <p>
          KT 하이오더는 소상공인 및 프랜차이즈를 위한 맞춤형 패키지를 제공합니다.<br/>
          합리적인 가격, 쉬운 설치, 그리고 안정적인 관리까지 한 번에!
        </p>
        <ul style="text-align: left; max-width: 600px;">
          <li>· 무인 키오스크 + 모바일 연동</li>
          <li>· 매장 주문, 포장, 배달 통합 지원</li>
          <li>· 실시간 주문 관리 및 통계 제공</li>
        </ul>
        <a href="tel:01033957700" class="cta-btn">상담 문의하기</a>
      </div>
    </div>
    <!-- 페이징 및 내비게이션 -->

    <div class="swiper-pagination"></div>
  </div>

  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      pagination: {
        el: '.swiper-pagination',
      },
    });
  </script>
</body>
</html>
