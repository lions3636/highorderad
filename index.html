
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KT 하이오더</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }
        .slides {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            width: 100vw;
            height: 100vh;
        }
        .slide {
            flex: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
        }
        .logo {
            width: 150px;
            margin-bottom: 20px;
        }
        .button {
            background-color: yellow;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        ul {
            font-size: 24px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="slides">
        <div class="slide">
            <img src="kt_logo_white_bg.png" alt="KT 로고" class="logo">
            <h2>KT 하이오더 장점</h2>
            <ul>
                <li>무인 주문 간편화</li>
                <li>소상공인 운영비 절감</li>
                <li>프랜차이즈 확장 최적화</li>
                <li>스마트 매장 관리</li>
                <li>고객 대기시간 최소화</li>
            </ul>
        </div>
        <div class="slide">
            <img src="kiosk1.jpg" alt="키오스크 이미지" width="60%">
            <a href="tel:01033957700"><button class="button">전화 연결: 010-3395-7700</button></a>
        </div>
        <div class="slide">
            <h2>프랜차이즈 패키지</h2>
            <p style="font-size: 22px;">KT 하이오더는 프랜차이즈를 위한 통합 솔루션을 제공합니다. 광고, 주문, 고객 관리까지 한 번에!</p>
        </div>
    </div>
</body>
</html>
